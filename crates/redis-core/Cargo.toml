[package]
name = "redis-core"
description = "Redis 访问核心层：RedisGateway 抽象 + fred 实现（不依赖 Tauri，可独立测试）"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
fred = { workspace = true, features = [
    "i-all",                # 全命令接口（GUI 需要广覆盖）
    "enable-rustls-ring",   # TLS via rustls + ring（纯 Rust，跨平台免依赖）
    "i-cluster",            # CLUSTER 命令（P1 Cluster）
    "i-slowlog",            # SLOWLOG（P1 慢日志）
    "subscriber-client",    # Pub/Sub 订阅（CLI 订阅态）
    "monitor",              # MONITOR 命令流（Pub/Sub 面板）
    "metrics",              # 延迟/包大小（底栏展示）
    "credential-provider",  # 动态认证 → 对接 keyring
    "serde-json",           # JSON 值转换
    "replicas",             # 副本路由（P2 只读负载）
] }
async-trait.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true

[features]
# 透传 fred 的 mocking 能力，用于不依赖真实 Redis 的单元测试
default = []
mocks = ["fred/mocks"]
